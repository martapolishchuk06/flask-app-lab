{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">{{ title }}</h1>
<div class="row">
    <div class="col-md-6 mb-4">
        <form action="#" method="post" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label for="name" class="form-label">Ваше ПІБ</label>
                <input type="text" class="form-control" id="name" placeholder="Введіть свої ПІБ" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email адреса</label>
                <input type="email" class="form-control" id="email" placeholder="Введіть свій email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Повідомлення</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Напишіть ваше повідомлення..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" onclick="alert('Форма є заглушкою!'); return false;">Надіслати</button>
        </form>
    </div>
    <div class="col-md-6">
        <h3>Мої контакти</h3>
        <p><strong>Email:</strong>marta.polishchuk.23@pnu.edu.ua</p>
        <p><strong>Телефон:</strong>+380 (44) 123 45 67</p>
        <p><strong>Місто:</strong>Івано-Франківськ, Україна</p>
    </div>
</div>
{% endblock %}
