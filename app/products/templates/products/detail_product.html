{% extends 'base.html' %}

{% block title %} {{ product.name }} Details {% endblock %}

{% block content %}
<div class="card shadow-sm mt-4">
    <div class="card-body">
        <h2 class="card-title">{{ product.name }}</h2>
        <h4 class="text-success">${{ product.price }}</h4>
        <p class="card-text mt-3">{{ product.content }}</p>
        <a href="{{ url_for('products.list_products') }}" class="btn btn-outline-secondary mt-3">Назад до списку товарів</a>
    </div>
</div>
{% endblock %}
