{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="alert alert-danger shadow mt-4">
    <h4 class="alert-heading">Підтвердження видалення</h4>
    <p>Ви дійсно бажаєте видалити пост <strong>"{{ post.title }}"</strong>?</p>
    <hr>
    <form method="POST">
        <button type="submit" class="btn btn-danger">Так, видалити</button>
        <a href="{{ url_for('posts.show_post', id=post.id) }}" class="btn btn-secondary">Скасувати</a>
    </form>
</div>
{% endblock %}
